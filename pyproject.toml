[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "promethea"
version = "0.1.0"
description = "A fast, uncluttered BitTorrent client built on libtorrent."
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "libtorrent>=2.0.9",
    "aiohttp>=3.9",
    "pywebview>=5.3",
    "pystray>=0.19",
    "Pillow>=10",
]

[project.optional-dependencies]
# packaging/build.ps1: the standalone app and its installer.
build = ["pyinstaller>=6.10"]

[project.gui-scripts]
promethea = "promethea.app:main"

[tool.setuptools.packages.find]
include = ["promethea*"]

[tool.setuptools.package-data]
promethea = ["web/**/*", "assets/*"]
